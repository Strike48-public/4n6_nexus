<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect for NEXUS -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow for depth -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>

  <!-- Grid pattern (optional forensic feel) -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E3A8A" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Large background "4n6" text (HOLLOW/OUTLINE style, centered, with glow and shadow) -->
  <text x="600" y="400" font-family="'Courier New', monospace" font-size="240" font-weight="700"
        fill="none" stroke="#1E3A8A" stroke-width="2" opacity="0.5"
        letter-spacing="20" text-anchor="middle"
        filter="url(#glow) url(#shadow)">
    4n6
  </text>

  <!-- Foreground "NEXUS" text (SOLID BLOCKS, uniform spacing, centered) -->
  <text x="600" y="350" font-family="'Courier New', monospace" font-size="110" font-weight="900"
        fill="url(#textGradient)" letter-spacing="8" text-anchor="middle">
    NEXUS
  </text>

  <!-- Tagline -->
  <text x="600" y="480" font-family="'Segoe UI', sans-serif" font-size="26"
        fill="#94A3B8" text-anchor="middle" font-weight="300">
    Autonomous DFIR with Architectural Self-Correction
  </text>

  <text x="600" y="520" font-family="'Segoe UI', sans-serif" font-size="22"
        fill="#64748B" text-anchor="middle" font-weight="300">
    Built on SANS SIFT Workstation + MCP Protocol
  </text>

  <!-- Metrics -->
  <rect x="280" y="580" width="640" height="60" rx="8" fill="#1E3A8A" opacity="0.3"/>

  <text x="420" y="620" font-family="'Segoe UI', monospace" font-size="22"
        fill="#22D3EE" font-weight="600">
    🎯 F1=1.00
  </text>

  <text x="560" y="620" font-family="'Segoe UI', sans-serif" font-size="22"
        fill="#64748B" font-weight="400">
    |
  </text>

  <text x="600" y="620" font-family="'Segoe UI', monospace" font-size="22"
        fill="#10B981" font-weight="600">
    15/15 Scenarios Pass
  </text>
</svg>
