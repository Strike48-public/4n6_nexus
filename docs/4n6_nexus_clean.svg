<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>

  <!-- Diagonal grid lines (slanted) -->
  <g opacity="0.15" stroke="#1E3A8A" stroke-width="1" fill="none">
    <!-- Diagonal lines going down-right -->
    <line x1="0" y1="0" x2="400" y2="800"/>
    <line x1="100" y1="0" x2="500" y2="800"/>
    <line x1="200" y1="0" x2="600" y2="800"/>
    <line x1="300" y1="0" x2="700" y2="800"/>
    <line x1="400" y1="0" x2="800" y2="800"/>
    <line x1="500" y1="0" x2="900" y2="800"/>
    <line x1="600" y1="0" x2="1000" y2="800"/>
    <line x1="700" y1="0" x2="1100" y2="800"/>
    <line x1="800" y1="0" x2="1200" y2="800"/>
    <line x1="900" y1="0" x2="1200" y2="600"/>
    <line x1="1000" y1="0" x2="1200" y2="400"/>
    <line x1="1100" y1="0" x2="1200" y2="200"/>

    <!-- Diagonal lines going down-left -->
    <line x1="1200" y1="0" x2="800" y2="800"/>
    <line x1="1100" y1="0" x2="700" y2="800"/>
    <line x1="1000" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="500" y2="800"/>
    <line x1="800" y1="0" x2="400" y2="800"/>
    <line x1="700" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="200" y2="800"/>
    <line x1="500" y1="0" x2="100" y2="800"/>
    <line x1="400" y1="0" x2="0" y2="800"/>
    <line x1="300" y1="0" x2="0" y2="600"/>
    <line x1="200" y1="0" x2="0" y2="400"/>
    <line x1="100" y1="0" x2="0" y2="200"/>
  </g>

  <!-- Large background "4n6" text (HOLLOW/OUTLINE style) -->
  <text x="600" y="450" font-family="'Courier New', monospace" font-size="280" font-weight="700"
        fill="none" stroke="#1E3A8A" stroke-width="3" opacity="0.6"
        letter-spacing="20" text-anchor="middle"
        filter="url(#glow)">
    4n6
  </text>

  <!-- Foreground "NEXUS" text (SOLID) -->
  <text x="600" y="520" font-family="'Courier New', monospace" font-size="140" font-weight="900"
        fill="url(#textGradient)" letter-spacing="12" text-anchor="middle"
        filter="url(#glow)">
    NEXUS
  </text>
</svg>
