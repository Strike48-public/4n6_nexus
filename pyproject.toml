[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-find-evil"
version = "1.0.0"
description = "DFIR detection engine with multi-agent self-correction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yara-python>=4.5.0",
    # Cross-artifact / cross-host correlation graph (sift_find_evil/graph/).
    "networkx>=3.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["sift_find_evil*"]
exclude = ["tests*", "scenarios*", "demo*", "logs*", "cases*", "rules*", "analysis*", "evidence*"]

[tool.black]
line-length = 88
target-version = ["py312"]
# Match what ruff excludes: vendored YARA community submodule has many black
# violations we don't own. Keep format surface aligned with lint surface.
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.ruff_cache
  | rules/yara/community
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
# the .proto and are not hand-maintained; excluding them keeps generated-code
# lint/format noise out of CI. Vendored YARA community rules likewise. The ui/
# subtree is a Rust workspace (the DFIR WebGUI); its stray Python (e.g. an
# inherited sidecar shim) is not part of the engine and must not gate Python CI.
extend-exclude = ["rules/yara/community", "ui"]

[tool.pytest.ini_options]
# Collect only the engine's own tests. testpaths scopes default collection to
# tests/; norecursedirs keeps the Rust ui/ subtree (and vendored rules) out even
# if a path is passed explicitly, so folding the WebGUI in never perturbs the
# Python test run.
testpaths = ["tests"]
norecursedirs = ["ui", "rules/yara/community", ".git", ".venv"]
markers = [
    "unit: Fast, isolated unit test",
    "integration: Crosses module boundaries or touches real artifacts",
]
# Pin the async-fixture loop scope pytest-asyncio 1.3 warns about (it will
# change the default to "function" in a future release). All async fixtures
# here are function-scoped already, so this fixes the value without changing
# behavior.
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["sift_find_evil"]
# Driver and pure-rendering layers are omitted so --cov-fail-under speaks to the
# detection library + orchestration surface, not to UI/CLI glue:
#   - cli.py / __main__.py / cli_mcp.py: thin argparse wrappers exercised E2E via
#     scenario_runner + CLI smoke tests, not unit tests.
#   - tui_app.py / tui/*: Textual rendering. Line coverage of widget composition
#     is brittle and low-signal; the interactive behavior is covered by the
#     Pilot-driven tests in tests/test_tui.py instead.
# Note: analysis_runner.py is intentionally NOT omitted — it orchestrates the
# detectors and is unit-tested end-to-end in tests/test_analysis_runner.py.
omit = [
    "sift_find_evil/cli.py",
    "sift_find_evil/__main__.py",
    "sift_find_evil/cli_mcp.py",
    "sift_find_evil/mcp/*",
    "sift_find_evil/reporting/*",
    "sift_find_evil/testing/*",
    "sift_find_evil/case/*",
    "sift_find_evil/approval/*",
    "sift_find_evil/audit/*",
    "sift_find_evil/tui_app.py",
    "sift_find_evil/tui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    # Protocol / abstract method stubs carry no executable body.
    "^\\s*\\.\\.\\.$",
    "^\\s*\\.\\.\\.  #",
]
show_missing = true
skip_covered = false
# Lock in 100% line coverage of the detection/orchestration surface (the omit
# list above scopes this to non-UI/non-glue code). A drop fails `coverage
# report`, so new uncovered lines must be tested or carry a justified
# `# pragma: no cover`. (SFE-eil)
fail_under = 100
