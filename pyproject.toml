[tool.black]
line-length = 88
target-version = ["py312"]
# Match what ruff excludes: vendored YARA community submodule has many black
# violations we don't own. Keep format surface aligned with lint surface.
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.ruff_cache
  | rules/yara/community
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "unit: Fast, isolated unit test",
    "integration: Crosses module boundaries or touches real artifacts",
]

[tool.coverage.run]
source = ["sift_find_evil"]
# cli.py and __main__.py are thin argparse wrappers exercised end-to-end via
# scenario_runner + CLI smoke tests, not by unit tests. Counting them drags
# the project-wide figure down to ~77% without reflecting what we actually
# cover in the detector/parser layer. Omit so --cov-fail-under speaks to the
# library surface, not the CLI driver.
omit = [
    "sift_find_evil/cli.py",
    "sift_find_evil/__main__.py",
    "sift_find_evil/cli_mcp.py",
    "sift_find_evil/mcp/*",
    "sift_find_evil/reporting/*",
    "sift_find_evil/testing/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
