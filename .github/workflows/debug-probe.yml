name: debug-probe
on:
  push:
    branches: [sync/catch-up]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: probe linux scenarios
        run: |
          python -m pip install -q -r requirements-dev.txt
          python - <<'PY'
          import sys, traceback
          sys.path.insert(0, 'tests')
          from pathlib import Path
          from tests.scenario_harness import discover_scenarios, run_scenario
          repo = Path('.')
          sc = discover_scenarios(repo)
          print('scenarios:', len(sc))
          for nm in ('27_linux_auth_bruteforce','29_linux_wtmp_login','31_linux_journald_bruteforce'):
              s = next((x for x in sc if x.name==nm), None)
              if not s: print(nm, 'NOT FOUND'); continue
              try:
                  from sift_find_evil.parsers import collect_linux_artifacts
                  arts = collect_linux_artifacts(s.directory / 'root')
                  print(nm, 'collect keys:', {k: len(v) for k,v in arts.items() if isinstance(v, (list,dict))})
                  r = run_scenario(s)
                  print(nm, 'fn=', r.false_negatives, 'tp=', r.true_positives)
              except Exception as e:
                  print(nm, 'EXC:', repr(e)); traceback.print_exc()
          PY
