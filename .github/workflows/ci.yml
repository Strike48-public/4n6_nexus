name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps for pytsk3 + libewf-python + libpff-python
        # These are sdist-only on PyPI and compile against system headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libewf-dev \
            libpff-dev \
            libtsk-dev \
            pkg-config

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python deps
        # requirements-dev.txt adds scapy so the PCAP-parser tests actually run
        # in CI instead of skipping silently (they synthesize .pcap fixtures).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff 'black==25.9.0'

      - name: ruff check
        run: ruff check .

      - name: black --check
        # Pinned to the same version declared in .pre-commit-config.yaml so
        # local pre-commit and CI never disagree on formatting.
        run: black --check sift_find_evil tests

      - name: pytest (with coverage gate)
        # Coverage threshold starts at 85% (current: 87% after excluding
        # cli.py/__main__.py, which are exercised E2E rather than by unit
        # tests — see [tool.coverage.run] omit in pyproject.toml). Bump this
        # when coverage rises; never lower it to accommodate new code.
        run: |
          pytest -q \
            --cov=sift_find_evil \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Upload coverage.xml artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
