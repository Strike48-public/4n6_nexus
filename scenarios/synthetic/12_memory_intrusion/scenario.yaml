name: 12_memory_intrusion
tier: synthetic
category: memory_forensics
difficulty: basic
description: >
  Memory forensics regression gate. Exercises MemoryDetector end-to-end
  on a hand-authored set of pre-parsed Volatility 3 plugin rows. No vol
  binary, no 4GB dump — the JSON fixtures mirror the runner's parsing
  output so the test is deterministic across machines.

source:
  provider: synthetic
  license: internal

fixtures:
  memory:
    windows_malfind: memory_fixtures/windows_malfind.json
    windows_pslist: memory_fixtures/windows_pslist.json
    windows_psscan: memory_fixtures/windows_psscan.json
    windows_cmdline: memory_fixtures/windows_cmdline.json
    windows_netscan: memory_fixtures/windows_netscan.json
    linux_bash: memory_fixtures/linux_bash.json
    linux_pslist: memory_fixtures/linux_pslist.json
    linux_sockstat: memory_fixtures/linux_sockstat.json

expected:
  malicious_executables: []
  finding_counts:
    memory_finding: 27
    total: 27
  min_precision: 1.0
  min_recall: 1.0

notes: |
  Twenty-seven expected findings covering MITRE memory + obfuscation techniques:

  Non-cmdline findings (6):
    - Windows malfind PAGE_EXECUTE_READWRITE VAD in svchost.exe (T1055)
    - Hidden process rootkit.exe present in psscan but not pslist (T1014)
    - Windows netscan powershell.exe ESTABLISHED to public:4444 (T1071)
    - Linux bash history curl|sh download-execute (T1059.004)
    - Linux kworker-style COMM with PPID != 2 masquerade (T1036)
    - Linux bash process with ESTABLISHED socket to public:4444 (T1071)

  Cmdline findings (21):
    - Original PID 5580: LOLBAS persistence finding (1)
    - T1140 corpus PIDs 6001-6010 (20 findings):
      * Each LOLBAS cmdline generates 2 findings:
        1. LOLBAS persistence (T1059) - all 10 cmdlines
        2. Deobfuscation/decode (T1140) - all 10 cmdlines
      * PowerShell -EncodedCommand download cradle (PID 6001)
      * pwsh -enc download+execute (PID 6002)
      * rundll32 squiblydoo javascript: (PID 6003)
      * regsvr32 squiblytwo remote scrobj.dll (PID 6004)
      * mshta HTTP remote payload (PID 6005)
      * mshta vbscript: protocol (PID 6006)
      * certutil -decode canonical T1140 (PID 6007)
      * bitsadmin /transfer download (PID 6008)
      * plaintext IEX + WebClient (PID 6009)
      * -EncodedCommand Reflection.Assembly load (PID 6010)

  The hand-authored JSON fixtures use the exact column names Volatility 3
  emits with `-r json` so any future runner-shape change surfaces as a
  parsing failure in one place instead of drift across detectors.
