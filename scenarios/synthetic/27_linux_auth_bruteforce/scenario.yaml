name: 27_linux_auth_bruteforce
tier: synthetic
category: credential_access
difficulty: intermediate
description: >
  Linux dead-disk SSH brute-force compromise scored off a RAW auth.log. The
  linux_artifacts fixture is a synthetic mounted-image root; the raw auth parser
  walks /var/log/auth.log and the collector assembles auth_events, which
  LinuxAuthDetector scans for a password-guessing run that culminates in a valid
  login (T1110.001 -> T1078). One malicious source IP (203.0.113.5: 8 failed
  root attempts then an Accepted) plus three precision decoys -- a benign
  low-failure login (alice, 2 typos then success, below threshold), a failed
  flood with no success (198.51.100.9, an attempt but no compromise), and a
  clean publickey login (deploy) -- so precision is exercised, not assumed: any
  decoy that fires scores as an extra -> false positive.

source:
  provider: synthetic
  license: internal

fixtures:
  linux_artifacts: root

expected:
  malicious_executables: []
  finding_counts:
    credential_access: 1
    total: 1
  min_precision: 1.0
  min_recall: 1.0

notes: |
  Exercises the auth-log parser + LinuxAuthDetector path end-to-end (SFE-rfhz),
  the Tranche-2 companion to 26_linux_intrusion_raw (persistence). The mounted
  root carries no Windows artifacts, so it runs through the has_linux gate; it
  carries no systemd/cron/sudoers/shell-init surfaces, so LinuxPersistenceDetector
  emits nothing and the only finding is the credential_access compromise.
