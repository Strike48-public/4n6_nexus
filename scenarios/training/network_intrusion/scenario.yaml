name: network_intrusion
tier: training
category: network_intrusion
difficulty: intermediate
description: >
  Linux Threat Analysis scenario (Digital Corpora, 2020), Stage 1
  perimeter capture. Network-based attack with C2 communications,
  paired with a memory capture from the compromised host. Focus:
  protocol analysis, C2 detection, malware network behavior,
  data exfiltration.

source:
  provider: digital_corpora
  url: https://digitalcorpora.org/corpora/scenarios/2020-linux-threat-analysis/
  date_published: 2020-01-01
  license: academic_use
  attribution: >
    Linux Threat Analysis scenario (Digital Corpora, 2020).
    Academic use per digitalcorpora.org.

evidence:
  - path: evidence/Day_1_Capture.7z
    kind: archive
    size_bytes: 924827765
    sha256: 3f75a2f78beee4abe8876be311c5dd5729556482d1c903758eb7651a8cf7c31a
    download_url: https://downloads.digitalcorpora.org/corpora/scenarios/2020-linux-threat-analysis/Stage1/Day_1_Capture.7z
    description: Day 1 perimeter PCAP, 7z-packed (~0.86 GB)
    required: true

  - path: evidence/ggmemday1.7z
    kind: memory
    size_bytes: 552477198
    sha256: 6d1f09d052be60a99c158f15e06b8ff5a9a3bd828910d6ac6756b13924f87d0f
    download_url: https://downloads.digitalcorpora.org/corpora/scenarios/2020-linux-threat-analysis/Stage1/ggmemday1.7z
    description: Day 1 memory capture (gg host), 7z-packed (~0.5 GB)
    required: true

expected:
  malicious_executables: []
  # Counts reflect what the current NetworkDetector pipeline produces on the
  # real Day 1 PCAP, post SFE-m82/SFE-cpg/SFE-dar/SFE-4wl/SFE-tcj/SFE-84s
  # detector landings. The scenario harness does not yet grade network-only
  # scenarios (requires MFT/prefetch/evtx fixtures), so these counts are
  # documentation rather than test assertions — they exist to keep the
  # expected envelope honest rather than tautologically passing with total=0.
  finding_counts:
    suspicious_host_access: 20       # pastebin, null-byte.wonderhowto, metasploit mirror
    offensive_package_install: 3     # metasploit-framework, john, mirror-only match
    cleartext_protocol: 4            # SMTP:25, POP3:110, IMAP:143, rsyslog:514
    asymmetric_outbound_transfer: 1  # 156.59.33.180 -> 44.226.54.40:443 (22x outbound)
    total: 28
  # Beaconing and DNS-tunneling detectors produce zero findings on this
  # capture: minimum observed CoV is 0.245 (threshold 0.15) and the longest
  # DNS label is an AWS ELB name (suppressed). That is expected and correct —
  # this capture's "evil" is watchlist-visible, not statistical.
  min_precision: 1.0
  min_recall: 1.0

questions:
  - What C2 channel(s) were used?
  - What data exfiltration occurred over the network?
  - Which process(es) in memory correspond to the network activity?
  - What network-based IOCs should be recorded?

notes: |
  Day_2_Capture.7z + ggmemday2.7z are also available under the same
  prefix if you want a two-day window. Extract with 7z; correlate
  PCAP flows with Volatility 3 netscan/netstat output.
