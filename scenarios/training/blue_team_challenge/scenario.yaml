name: blue_team_challenge
tier: training
category: compromise_investigation
difficulty: advanced
description: >
  Linux Threat Analysis scenario (Digital Corpora, 2020), Stage 3
  workstation slice. Compromised analyst workstation with a paired
  memory capture. Focus: disk + memory correlation, persistence
  mechanisms, lateral-movement indicators, cross-artifact timeline.

source:
  provider: digital_corpora
  url: https://digitalcorpora.org/corpora/scenarios/2020-linux-threat-analysis/
  date_published: 2020-01-01
  license: academic_use
  attribution: >
    Linux Threat Analysis scenario (Digital Corpora, 2020).
    Academic use per digitalcorpora.org.

evidence:
  - path: evidence/alison_ws.7z
    kind: archive
    size_bytes: 8551539548
    sha256: 80b5a13a46df07839e75181a962b5ab78ea66d518b984cd915e52fa0ceb0ccb4
    download_url: https://downloads.digitalcorpora.org/corpora/scenarios/2020-linux-threat-analysis/Stage3/alison_ws.7z
    description: Stage 3 compromised workstation image, 7z-packed (~8 GB)
    required: true

  - path: evidence/aamemend.7z
    kind: memory
    size_bytes: 811401833
    sha256: 2676d4506ca4eae967877f2812a14b057ba3b2fb13d9f365b6f22eb426e1e185
    download_url: https://downloads.digitalcorpora.org/corpora/scenarios/2020-linux-threat-analysis/Stage5/aamemend.7z
    description: Paired end-state memory capture, 7z-packed (~0.8 GB)
    required: true

expected:
  malicious_executables: []
  finding_counts:
    total: 0
  min_precision: 1.0
  min_recall: 1.0

questions:
  - What was the initial access vector?
  - What persistence mechanisms are present on the workstation?
  - What lateral-movement indicators exist in memory and on disk?
  - Which processes in memory correspond to malicious activity?

notes: |
  Extract with 7z before analysis. Stages 2 and 4 hold supporting
  logs (pfSense, DNS, log aggregation) that can enrich the
  investigation; Stage 1 captures are covered by network_intrusion.
  Requires Volatility 3 for the Linux memory dump.
