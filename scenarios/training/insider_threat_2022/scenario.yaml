name: insider_threat_2022
tier: training
category: insider_threat
difficulty: intermediate
description: >
  Narcos scenario (Digital Corpora, 2019) — CCleaner custodian subset.
  Authorized user exfiltrating sensitive data; CCleaner runs muddy
  the filesystem timeline. Focus: USB device artifacts, anti-forensic
  tool use, user activity reconstruction across disk + memory.

source:
  provider: digital_corpora
  url: https://digitalcorpora.org/corpora/scenarios/2019-narcos/
  date_published: 2019-01-01
  license: academic_use
  attribution: >
    Narcos scenario (Digital Corpora, 2019). Academic use per
    digitalcorpora.org.

evidence:
  - path: evidence/Narcos-CCleaner.E01
    kind: e01
    size_bytes: 8174198160
    sha256: null
    download_url: https://downloads.digitalcorpora.org/corpora/scenarios/2019-narcos/Narcos-CCleaner.E01
    description: CCleaner-custodian disk image (~7.6 GB)
    required: true

  - path: evidence/Narcos-Mem-CCleaner.E01
    kind: memory
    size_bytes: 1547259526
    sha256: null
    download_url: https://downloads.digitalcorpora.org/corpora/scenarios/2019-narcos/Narcos-Mem-CCleaner.E01
    description: CCleaner-custodian memory capture (~1.4 GB)
    required: true

expected:
  malicious_executables: []
  finding_counts:
    total: 0
  min_precision: 1.0
  min_recall: 1.0

questions:
  - What USB devices connected to the host?
  - What anti-forensic actions (CCleaner runs) affected the evidence?
  - What sensitive documents were accessed shortly before disconnect?
  - What cloud storage providers appear in the artifacts?

notes: |
  Full 50+ GB Narcos corpus (3 custodians, all memory captures) sits
  under the same prefix. Jane and Steve custodian images are
  additional options. Memory dump is packaged as an E01 container.
