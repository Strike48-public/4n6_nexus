name: ransomware_2021
tier: training
category: ransomware
difficulty: intermediate
description: >
  LoneWolf scenario (Digital Corpora, 2018) — single-user Windows 10
  workstation with a disgruntled employee preparing a violent act.
  Stands in for ransomware/insider-style investigations: phishing
  artifacts, filesystem timeline, persistence, attribution indicators.

source:
  provider: digital_corpora
  url: https://digitalcorpora.org/corpora/scenarios/2018-lonewolf/
  date_published: 2018-01-01
  license: academic_use
  attribution: >
    LoneWolf scenario (Digital Corpora, 2018). Academic use per
    digitalcorpora.org.

evidence:
  - path: evidence/Forensic_Image_Files.zip
    kind: archive
    size_bytes: 15770423411
    sha256: null
    download_url: https://downloads.digitalcorpora.org/corpora/scenarios/2018-lonewolf/Forensic%20Image%20Files.zip
    description: LoneWolf forensic image bundle (~14.7 GB)
    required: true

expected:
  malicious_executables: []
  finding_counts:
    total: 0
  min_precision: 1.0
  min_recall: 1.0

questions:
  - What was the initial compromise / delivery vector?
  - What is the scope of encrypted or modified files?
  - What persistence or lateral-movement indicators exist?
  - What attribution markers are present in the artifacts?

notes: |
  The full 32 GB LoneWolf_Image_Files.zip is also available at the
  same prefix if you need raw disk images alongside the curated
  forensic set. Extract with unzip; expect .E01 segments and
  supporting artifacts inside.
