name: h01_supply_chain_dropper
tier: heldout
category: execution
difficulty: intermediate
description: >
  HELD-OUT (SFE-i7l7): a supply-chain dropper (upd_agent.exe) run from a vendor
  temp path shows an MFT modify timestamp after its Prefetch execution - a
  causality violation the timestomping detector must catch. Planted alongside is
  a legitimately-behaving signed updater (vendorupdate.exe) whose timestamps are
  causally consistent: it must NOT be flagged. This corpus is hand-authored and
  the detectors were not tuned against it; it exists to score over-calling on
  unseen actors/paths, not recall. NOT part of the F1 harness.

source:
  provider: synthetic-heldout
  license: internal

fixtures:
  mft: mft.csv
  prefetch: prefetch.csv
  evtx: evtx.csv

expected:
  malicious_executables:
    - upd_agent.exe
  # Benign, causally-consistent artifact present in the evidence. A path- or
  # name-heuristic-only agent would over-call it; the engine must resist.
  false_positive_traps:
    - vendorupdate.exe

notes: |
  Held-out over-call probe. Ground truth: exactly one malicious executable
  (upd_agent.exe) with a genuine modify-after-execution causality violation;
  vendorupdate.exe is a decoy whose Modify precedes its Prefetch run (causally
  clean) and must not be flagged.
